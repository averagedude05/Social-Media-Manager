<!DOCTYPE html>
<html>
<head>
    <title>Social Manager - Login</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const API_URL = "https://social-media-manager-1-raqh.onrender.com/api/login";

function App() {

    const [email, setEmail] = useState("");
    const [password, setPassword] = useState("");
    const [error, setError] = useState("");
    const [success, setSuccess] = useState(false);
    const [loading, setLoading] = useState(false);

    async function handleSubmit(e) {
        e.preventDefault();
        setError("");

        if (!email || !password) {
            setError("Please fill in all fields.");
            return;
        }
        setLoading(true);

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email,password })
            });

            const data = await response.json();

            if (response.ok) {
                setSuccess(true);
            } else if (response.status === 404 && data.code === "USER_NOT_FOUND") {
                setError("Account not registered. Please register first.");
            } else if (response.status === 401) {
                setError("Incorrect email or password.");
            } else {
                setError( data.error || data.message || "Login failed. Please try again.");
            }

        } catch (error) {
            setError("Connection Error: " + error.message);
            console.error("Login Error:", error);

        } finally {
            setLoading(false);
        }
    }

    if (success) {
        return (
            <div className="container">
                <h1>Login Successful!</h1>
                <p className="success"> You have logged in successfully. </p>
            </div>
        );
    }

    return (
        <div className="container">
            <h1>Bro, You Again? 💀</h1>
            <p className="subtitle"> Your posts are flopping. Get to work, clown. 🤡 </p>
            <form onSubmit={handleSubmit}>

                <label>Email</label>
                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Enter your email"
                    required
                />

                <label>Password</label>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Enter your password"
                    required
                />

                {error && (<p className="error">{error}</p>)}

                <button type="submit" disabled={loading}>
                    {loading ? "Logging In..." : "Login"}
                </button>

                <p className="form-footer"> Don't have an account? 
                    <a href="Registration.html"> Register</a>
                </p>

            </form>

        </div>
    );
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);
</script>

</body>
</html>
